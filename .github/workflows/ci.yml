name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test review -v2

      - name: Deployment checks
        # The same checks that run before a real deploy: with DEBUG off, Django audits the
        # security settings, so a regression in TLS or cookie handling fails here rather than
        # in production.
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-ephemeral-key-not-used-to-serve-anything
        run: python manage.py check --deploy --fail-level WARNING

      - name: Check for missing migrations
        # Catches a model edited without `makemigrations`, which otherwise only shows up as a
        # confusing runtime error on someone else's machine.
        run: python manage.py makemigrations --check --dry-run
